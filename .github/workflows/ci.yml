name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The first entry must be the major in `engines.node`, or the declared
      # floor becomes an unverified claim. `20` here resolves to the LATEST
      # 20.x, which is why the separate `node-min-smoke` job below pins the
      # exact floor. Both are required: this job proves the toolchain and the
      # suite work on the major, the smoke job proves the shipped artifact works
      # on the exact floor. `scripts/validate-release.spec.mjs` fails if this
      # list loses that major. Adding a newer major is always allowed.
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FULL history. `releaseCommitOf` in
          # tests/surface/surface-changelog-direction-witnesses.spec.ts and
          # tests/surface/surface-bun-smoke-exclusion-reason.spec.ts walks
          # `git log -- package.json` looking for the commit whose manifest
          # reads a given version, then `git archive`s that tree and rebuilds it
          # to measure a differential against the release being cut. The default
          # depth of 1 leaves one commit in the history, so the walk finds
          # nothing and the specs die with "no commit in this history publishes
          # 2.0.1" — which is what run 31961164576 reported five times.
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # Deno, in the TEST job as well as in `deno-smoke`.
      #
      # `scripts/check-consumer-entry.spec.mjs` drives `check-deno-consumer`
      # end to end — a real pack, install, and `deno check` — and without a Deno
      # binary those rows fail rather than skip. Run 31961164576 reported three
      # of them. The gate needs Deno, so the gate installs Deno: marking the
      # rows skip-without-deno would hide a regression in the one consumer path
      # that proves the published `.d.mts` declarations resolve.
      #
      # Same pin as `deno-smoke` below, and for the same reason: the major this
      # release is validated against is a decision here, not an action default
      # that can move under the gate.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Bun, for the same reason and with the same pin as `bun-smoke` below.
      #
      # Several suites are gated on a Bun binary and SKIP without one, and a
      # skipped suite still counts against the 100 percent coverage threshold —
      # its lines are never executed. Run 31961787204 was the first time
      # `pnpm coverage` reached the threshold in CI at all, and it reported
      # 99.29 percent of lines with nine rows skipped for a missing runtime.
      # The threshold has therefore never been enforced in CI: it held on a
      # workstation that happens to have Bun, Deno, and esbuild.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Prose gate: relative links in README, controlled-vocabulary violations,
      # and the README Terms table against docs/writing-standard.md. Needs no
      # dist/ and no tsc, so it runs BEFORE build and fails in milliseconds.
      - run: pnpm check-doc-style
      - run: pnpm build
      # Must run AFTER build, and it did not until run 31920651241 failed on all
      # three Node versions with eight TS2307s. `surface-built-entry-behaviour`
      # and `surface-package-consumer` name the package in a type position —
      # `typeof import("@pbpeterson/typed-fetch")` — which TypeScript resolves by
      # SELF-REFERENCE, through this package's own `exports` map, to
      # `dist/*.d.ts`. With no dist/ there is nothing to resolve. A workstation
      # never sees it, because a previous build leaves dist/ lying there; a clean
      # checkout is the only place the missing dependency shows.
      - run: pnpm typecheck
      # Must run AFTER build: public-surface.spec.ts contains dist-gated suites
      # (public API surface snapshots, cross-copy guard tests) that hard-fail in
      # CI when dist/ is absent. Do not reorder build/test.
      - run: pnpm test
        # A full record of the run, kept. The default reporter prints to a
        # terminal and keeps nothing, so a red run used to leave a summary line
        # with no test name, no duration, and no stack — round 24 lost an
        # intermittent failure that way and never identified it. The upload step
        # below runs on failure too, so the next occurrence is diagnosable.
        env:
          VITEST_JSON_REPORT: test-results/test.json
      # Enforce the 100 percent statements/branches/functions/lines thresholds
      # over src, scripts, and fixtures. Runs the whole suite again under v8
      # coverage instrumentation, so it needs the built dist/ the same as the
      # gates below it.
      - run: pnpm coverage
        # A separate file: this run is the same suite under instrumentation, and
        # overwriting the first record would lose the faster of the two.
        env:
          VITEST_JSON_REPORT: test-results/coverage.json
      # ALWAYS, because the record is worth most when the run is red.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          # ERROR, not warn. On a green run the suite ran, so an empty
          # `test-results/` means the capture is wired wrong — the reporter did
          # not fire, or `VITEST_JSON_REPORT` did not reach it. Run 31920651241
          # uploaded zero artifacts and said so in a warning nobody had to read.
          # The record exists to make the NEXT failure diagnosable, so it fails
          # loudly the moment it stops being written rather than the moment it
          # is needed.
          #
          # A job that dies BEFORE `pnpm test` uploads nothing and errors here
          # too. That is accepted: the job is already red, and a second red step
          # costs nothing next to a capture that quietly stopped working.
          if-no-files-found: error
          retention-days: 14
      # Typecheck every fenced TS block in the docs against the BUILT package
      # (dist/). Must run AFTER build — dist/ is the compile target, and the
      # guard fails loudly if it is absent. Catches doc examples that no longer
      # compile against the shipped types (e.g. `error.status` on the raw union).
      - run: pnpm check-docs
      # Catch a broken `files`/build-output contract on PRs, long before it can
      # reach the release workflow and publish a code-less tarball.
      - run: pnpm verify-pack
      # Pack the tarball and consume it as a real downstream user would: install
      # it into a scratch project and exercise the INSTALLED package across the
      # `exports` map (`.` vs `./errors`), across formats (ESM vs CJS), and under
      # a consumer's own tsc (bundler + nodenext). Every other test runs against
      # `src/` or a single built entry — none installs the artifact. Must run
      # AFTER build (it packs dist/).
      - run: pnpm check-consumer

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runtime dependencies have the strictest floor; the package currently
      # has none. High/critical advisories anywhere in the development graph
      # also block merge and release.
      - run: pnpm audit:prod
      - run: pnpm run audit:ci

  bun-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun run scripts/smoke/bun.mjs

  # The declared engines floor, actually executed. `node-version: 20` resolves
  # to the LATEST 20.x, so the matrix job above never runs the floor — which is
  # how the README's AbortSignal.any() recipe (Node 20.3.0+) went unnoticed
  # against the former `engines: >=20` floor, and how clone() + cancel()
  # deadlocking on undici 5.x went unnoticed for longer. The toolchain does NOT
  # run here: build and pack on 22, then switch to the floor and exercise the
  # artifact only.
  node-min-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.13.0
      - run: node --version
      - run: node scripts/smoke/node-min.mjs

  deno-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pinned: `scripts/check-deno-consumer.mjs` requires Deno 2 or newer, so
      # the major this release is validated against is a decision here, not an
      # action default that can move under the gate.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Install the packed artifact into a package.json project so Deno must
      # resolve the public exports map and .d.mts declarations, not just JS.
      - run: pnpm check-deno-consumer
      # Separate direct-dist smoke: syntax + runtime behavior in Deno.
      - run: pnpm smoke:deno
