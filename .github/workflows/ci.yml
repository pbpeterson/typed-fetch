name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The first entry must be the major in `engines.node`, or the declared
      # floor becomes an unverified claim. `20` here resolves to the LATEST
      # 20.x, which is why the separate `node-min-smoke` job below pins the
      # exact floor. Both are required: this job proves the toolchain and the
      # suite work on the major, the smoke job proves the shipped artifact works
      # on the exact floor. `scripts/validate-release.spec.mjs` fails if this
      # list loses that major. Adding a newer major is always allowed.
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Prose gate: relative links in README, controlled-vocabulary violations,
      # and the README Terms table against docs/writing-standard.md. Needs no
      # dist/ and no tsc, so it runs BEFORE build and fails in milliseconds.
      - run: pnpm check-doc-style
      - run: pnpm typecheck
      - run: pnpm build
      # Must run AFTER build: public-surface.spec.ts contains dist-gated suites
      # (public API surface snapshots, cross-copy guard tests) that hard-fail in
      # CI when dist/ is absent. Do not reorder build/test.
      - run: pnpm test
      # Enforce the 100 percent statements/branches/functions/lines thresholds
      # over src, scripts, and fixtures. Runs the whole suite again under v8
      # coverage instrumentation, so it needs the built dist/ the same as the
      # gates below it.
      - run: pnpm coverage
      # Typecheck every fenced TS block in the docs against the BUILT package
      # (dist/). Must run AFTER build — dist/ is the compile target, and the
      # guard fails loudly if it is absent. Catches doc examples that no longer
      # compile against the shipped types (e.g. `error.status` on the raw union).
      - run: pnpm check-docs
      # Catch a broken `files`/build-output contract on PRs, long before it can
      # reach the release workflow and publish a code-less tarball.
      - run: pnpm verify-pack
      # Pack the tarball and consume it as a real downstream user would: install
      # it into a scratch project and exercise the INSTALLED package across the
      # `exports` map (`.` vs `./errors`), across formats (ESM vs CJS), and under
      # a consumer's own tsc (bundler + nodenext). Every other test runs against
      # `src/` or a single built entry — none installs the artifact. Must run
      # AFTER build (it packs dist/).
      - run: pnpm check-consumer

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runtime dependencies have the strictest floor; the package currently
      # has none. High/critical advisories anywhere in the development graph
      # also block merge and release.
      - run: pnpm audit:prod
      - run: pnpm run audit:ci

  bun-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun run scripts/smoke/bun.mjs

  # The declared engines floor, actually executed. `node-version: 20` resolves
  # to the LATEST 20.x, so the matrix job above never runs the floor — which is
  # how the README's AbortSignal.any() recipe (Node 20.3.0+) went unnoticed
  # against the former `engines: >=20` floor, and how clone() + cancel()
  # deadlocking on undici 5.x went unnoticed for longer. The toolchain does NOT
  # run here: build and pack on 22, then switch to the floor and exercise the
  # artifact only.
  node-min-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.13.0
      - run: node --version
      - run: node scripts/smoke/node-min.mjs

  deno-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pinned: `scripts/check-deno-consumer.mjs` requires Deno 2 or newer, so
      # the major this release is validated against is a decision here, not an
      # action default that can move under the gate.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Install the packed artifact into a package.json project so Deno must
      # resolve the public exports map and .d.mts declarations, not just JS.
      - run: pnpm check-deno-consumer
      # Separate direct-dist smoke: syntax + runtime behavior in Deno.
      - run: pnpm smoke:deno
