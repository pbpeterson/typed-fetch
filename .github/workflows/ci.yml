name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      # Must run AFTER build: test.spec.ts contains dist-gated suites (public
      # API surface snapshots, cross-copy guard tests) that hard-fail in CI
      # when dist/ is absent. Do not reorder build/test.
      - run: pnpm test
      # Typecheck every fenced TS block in the docs against the BUILT package
      # (dist/). Must run AFTER build — dist/ is the compile target, and the
      # guard fails loudly if it is absent. Catches doc examples that no longer
      # compile against the shipped types (e.g. `error.status` on the raw union).
      - run: pnpm check-docs
      # Catch a broken `files`/build-output contract on PRs, long before it can
      # reach the release workflow and publish a code-less tarball.
      - run: pnpm verify-pack
      # Pack the tarball and consume it as a real downstream user would: install
      # it into a scratch project and exercise the INSTALLED package across the
      # `exports` map (`.` vs `./errors`), across formats (ESM vs CJS), and under
      # a consumer's own tsc (bundler + nodenext). Every other test runs against
      # `src/` or a single built entry — none installs the artifact. Must run
      # AFTER build (it packs dist/).
      - run: pnpm check-consumer

  bun-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun run scripts/smoke/bun.mjs

  deno-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: deno check scripts/smoke/deno.ts
      - run: deno run --allow-net scripts/smoke/deno.ts
