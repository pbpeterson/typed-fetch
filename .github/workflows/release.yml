name: Release

# Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com: package Settings → Trusted Publisher →
# GitHub Actions, repository pbpeterson/typed-fetch, workflow release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Build explicitly BEFORE test and publish. Do NOT rely on the
      # `prepublishOnly` lifecycle hook — if it is renamed, removed, or a
      # package-manager version stops honoring it under OIDC trusted publishing,
      # the release would publish a tarball with no compiled code. Building here
      # also means `dist/` exists when tests run, so the API-surface snapshot
      # test (gated on dist existence) is exercised instead of skipped.
      - run: pnpm build
      - run: pnpm test
      # Defense in depth: assert the tarball that WOULD be published actually
      # contains the compiled entry points before we publish it.
      - run: pnpm verify-pack
      - run: npm publish --provenance --access public
