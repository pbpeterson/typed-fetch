name: Release

# Publishes via npm trusted publishing (OIDC) — no long-lived npm token.
# Trusted Publisher is configured for pbpeterson/typed-fetch and release.yml on
# npmjs.com. Recheck that registry setting before each tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  checks:
    # Run the exact same Node 20/22/24, security, Bun, Deno, and Node-floor jobs as CI.
    # `publish` cannot start unless every job in this reusable workflow passes.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Fail before installation if the vX.Y.Z tag, package version, dated
      # changelog, tag target, or current origin/main tip do not all match.
      - id: release
        run: |
          git fetch --no-tags origin main
          node scripts/validate-release.mjs
      # Trusted publishing requires npm >= 11.5. Pin it so an npm release
      # cannot silently change the publisher between review and execution.
      - run: npm install -g npm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-doc-style
      - run: pnpm typecheck
      # Build explicitly BEFORE test and publish. The `prepublishOnly` hook
      # verifies the artifact rather than building it, precisely so that the
      # tarball npm uploads is the one every gate below inspected — a rebuild
      # in the hook would run tsup with `clean: true` after the fact. Building
      # here also means `dist/` exists when tests run, so the API-surface
      # snapshot test (gated on dist existence) is exercised instead of skipped.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check-docs
      # Defense in depth: assert the tarball's file manifest (required entry
      # points present, no source/test leaks) before we publish it. Contents
      # are covered by the API-surface snapshot test above, which runs first.
      - run: pnpm verify-pack
      - run: pnpm check-consumer
      - run: pnpm audit:prod
      - run: pnpm audit
      # The dist-tag reaches npm through the environment, not through raw
      # expression interpolation on the command line. If validate-release did not
      # run, the step never wrote the output, and an empty value would leave npm
      # with a bare `--tag`. Stop here instead, and name the cause.
      - env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          [ -n "$DIST_TAG" ] || {
            echo "publish: dist_tag is empty; validate-release did not run." >&2
            exit 1
          }
          npm publish --provenance --access public --tag "$DIST_TAG"
