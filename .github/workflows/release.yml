name: Release

# Publishes via npm trusted publishing (OIDC) — no long-lived npm token.
# Trusted Publisher is configured for pbpeterson/typed-fetch and release.yml on
# npmjs.com. Recheck that registry setting before each tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  checks:
    # Run the exact same Node 20/22/24, security, Bun, Deno, and Node-floor jobs as CI.
    # `package` cannot start unless every job in this reusable workflow passes.
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Fail before installation if the vX.Y.Z tag, package version, dated
      # changelog, tag target, or current origin/main tip do not all match.
      - id: release
        run: |
          git fetch --no-tags origin main
          node scripts/validate-release.mjs
      # Trusted publishing requires npm >= 11.5. Pin it so an npm release
      # cannot silently change the publisher between review and execution.
      - run: npm install -g npm@11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-doc-style
      # Build explicitly BEFORE typecheck, test, and publish. The
      # `prepublishOnly` hook verifies the artifact rather than building it,
      # precisely so that the tarball npm uploads is the one every gate below
      # inspected — a rebuild in the hook would run tsup with `clean: true`
      # after the fact. Building here also means `dist/` exists when tests run,
      # so the API-surface snapshot test (gated on dist existence) is exercised
      # instead of skipped.
      - run: pnpm build
      # Must run AFTER build, and it did not until run 31920651241 failed on all
      # three Node versions with eight TS2307s. `surface-built-entry-behaviour`
      # and `surface-package-consumer` name the package in a type position —
      # `typeof import("@pbpeterson/typed-fetch")` — which TypeScript resolves by
      # SELF-REFERENCE, through this package's own `exports` map, to
      # `dist/*.d.ts`. With no dist/ there is nothing to resolve.
      - run: pnpm typecheck
      - run: pnpm test
      # Enforce the 100 percent statements/branches/functions/lines thresholds
      # over src, scripts, and fixtures. Runs the whole suite again under v8
      # coverage instrumentation, so it needs the built dist/ the same as the
      # gates below it.
      - run: pnpm coverage
      - run: pnpm check-docs
      # Defense in depth: assert the tarball's file manifest (required entry
      # points present, no source/test leaks) before we publish it. Contents
      # are covered by the API-surface snapshot test above, which runs first.
      - run: pnpm verify-pack
      - run: pnpm check-consumer
      - run: pnpm audit:prod
      - run: pnpm run audit:ci
      # Create the exact package tarball after every gate has inspected the
      # build. The publish job receives no checkout and runs no package scripts;
      # it can only upload this immutable artifact.
      - name: Stage package and pinned npm CLI
        run: |
          mkdir -p release-artifact/package release-artifact/npm-cli
          npm pack --pack-destination release-artifact/package
          npm pack npm@11.18.0 --ignore-scripts --pack-destination release-artifact/npm-cli
          # Validate the STAGED FILE, not another dry run. `pnpm verify-pack`
          # above inspected what a pack would produce; this inspects the tarball
          # that is about to be hashed, uploaded, and published.
          shopt -s nullglob
          staged=(release-artifact/package/*.tgz)
          [ "${#staged[@]}" -eq 1 ] || {
            echo "package: expected exactly one staged package tarball." >&2
            exit 1
          }
          node scripts/verify-pack.mjs "$(realpath "${staged[0]}")"
          cd release-artifact
          find . -type f -name '*.tgz' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-artifacts
          path: release-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # required only here for OIDC trusted publishing + provenance
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-artifacts
          path: release-artifact
      # The dist-tag reaches npm through the environment, not through raw
      # expression interpolation on the command line. If validate-release did not
      # write the package-job output, an empty value would leave npm with a bare
      # `--tag`. Stop here instead, and name the cause.
      - env:
          DIST_TAG: ${{ needs.package.outputs.dist_tag }}
        run: |
          [ -n "$DIST_TAG" ] || {
            echo "publish: dist_tag is empty; validate-release did not run." >&2
            exit 1
          }
          cd release-artifact
          sha256sum -c SHA256SUMS

          package_tarballs=(package/*.tgz)
          npm_cli_tarballs=(npm-cli/*.tgz)
          [ "${#package_tarballs[@]}" -eq 1 ] && [ -f "${package_tarballs[0]}" ] || {
            echo "publish: expected exactly one package tarball." >&2
            exit 1
          }
          [ "${#npm_cli_tarballs[@]}" -eq 1 ] && [ -f "${npm_cli_tarballs[0]}" ] || {
            echo "publish: expected exactly one npm CLI tarball." >&2
            exit 1
          }

          # ABSOLUTE PATH, resolved with realpath. npm reads this argument as a
          # package SPEC, and a spec is only a file path when it starts with
          # `.`, `/`, `~/`, or a drive letter. `package/<name>.tgz` starts with
          # none of them, so npm read it as the GitHub shorthand
          # `owner/repo` and ran `git ls-remote
          # ssh://git@github.com/package/<name>.tgz.git`. The publish job has no
          # checkout and no git credentials, so the release failed there —
          # after every gate had passed.
          package_tarball="$(realpath "${package_tarballs[0]}")"

          mkdir npm-cli-extracted
          tar -xzf "${npm_cli_tarballs[0]}" -C npm-cli-extracted
          node npm-cli-extracted/package/bin/npm-cli.js publish "$package_tarball" \
            --ignore-scripts --provenance --access public --tag "$DIST_TAG"
